{% extends 'base.html' %}

{% block title %}Book List{% endblock %}
{% block body_class %}index{% endblock %}

{% block main %}
    <h1>Books List</h1>

    <a href="{{ url_for('book_create') }}">Create new</a>

    <ul class="index-list">
        {% for book in books %}
            <li>
                <h3>{{ book.title }}</h3>
                <small>by {{ book.author }}</small>
                <ul class="action-list">
                    <li><a href="{{ url_for('book_show', id=book.id) }}">Details</a></li>
                    <li><a href="{{ url_for('book_edit', id=book.id) }}">Edit</a></li>
                </ul>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
