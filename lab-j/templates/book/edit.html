{% extends 'base.html' %}

{% block title %}Edit Book {{ book.title }} ({{ book.id }}){% endblock %}
{% block body_class %}edit{% endblock %}

{% block main %}
    <h1>Edit Book {{ book.title }} ({{ book.id }})</h1>

    <form action="{{ url_for('book_edit', id=book.id) }}" method="post" class="edit-form">
        {% include 'book/_form.html' %}
    </form>

    <ul class="action-list">
        <li>
            <a href="{{ url_for('book_index') }}">Back to list</a>
        </li>
        <li>
            <form action="{{ url_for('book_delete', id=book.id) }}" method="post" style="display:inline;">
                <input type="submit" value="Delete" onclick="return confirm('Are you sure?')">
            </form>
        </li>
    </ul>
{% endblock %}
