<div class="form-group">
    <label for="title">Title</label>
    <input type="text" id="title" name="title" value="{{ book.title if book else '' }}">
</div>

<div class="form-group">
    <label for="author">Author</label>
    <input type="text" id="author" name="author" value="{{ book.author if book else '' }}">
</div>

<div class="form-group">
    <label for="isbn">ISBN</label>
    <input type="text" id="isbn" name="isbn" value="{{ book.isbn if book else '' }}">
</div>

<div class="form-group">
    <label for="publication_year">Publication Year</label>
    <input type="number" id="publication_year" name="publication_year" value="{{ book.publication_year if book and book.publication_year else '' }}">
</div>

<div class="form-group">
    <label></label>
    <input type="submit" value="Submit">
</div>
